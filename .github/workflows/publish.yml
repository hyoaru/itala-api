name: Publish

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.setup.outputs.environment }}
    steps:
      - id: setup
        run: echo "environment=production" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout
        uses: hyoaru/actions/checkout@v1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Go
        uses: hyoaru/actions/setup-go@v1
        with:
          go-version-file: "go.mod"

      - name: Build lambda
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-X github.com/hyoaru/itala-api/version.Version=${{ github.event.release.tag_name }}" \
            -o bootstrap cmd/lambda/main.go
          zip -j function.zip bootstrap

      - name: Upload build artifact
        uses: hyoaru/actions/upload-artifact@v1
        with:
          name: build-${{ github.event.release.tag_name }}
          path: function.zip
          if-no-files-found: error

  deploy:
    needs: [setup, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Download build artifact
        uses: hyoaru/actions/download-artifact@v1
        with:
          name: build-${{ github.event.release.tag_name }}
          path: .

      - name: Configure AWS credentials
        uses: hyoaru/actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get configuration
        run: |
          API_FUNCTION_S3_URI=$(aws ssm get-parameter \
            --name "/itala/api-function-s3-uri" \
            --query "Parameter.Value" \
            --output text)
          API_FUNCTION_S3_URI_BASE=$(aws ssm get-parameter \
            --name "/itala/api-function-s3-uri-base" \
            --query "Parameter.Value" \
            --output text)
          API_FUNCTION_NAME=$(aws ssm get-parameter \
            --name "/itala/api-function-name" \
            --query "Parameter.Value" \
            --output text)


          echo "API_FUNCTION_S3_URI=$API_FUNCTION_S3_URI" >> "$GITHUB_ENV"
          echo "API_FUNCTION_S3_URI_BASE=$API_FUNCTION_S3_URI_BASE" >> "$GITHUB_ENV"
          echo "API_FUNCTION_NAME=$API_FUNCTION_NAME" >> "$GITHUB_ENV"

      - name: Deploy function
        run: |
          # Deploy  to s3
          aws s3 cp function.zip "${{ env.API_FUNCTION_S3_URI }}"
          aws s3 cp function.zip "${{ env.API_FUNCTION_S3_URI_BASE }}/${{ github.event.release.tag_name }}/function.zip"
          # Update lambda function
          S3_URI="${{ env.API_FUNCTION_S3_URI }}"
          S3_BUCKET="${S3_URI#s3://}"
          S3_BUCKET="${S3_BUCKET%%/*}"
          S3_KEY="${S3_URI#s3://*/}"
          aws lambda update-function-code --function-name ${{ env.API_FUNCTION_NAME }} --s3-bucket "$S3_BUCKET" --s3-key "$S3_KEY"
  notify:
    needs: [setup, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify discord
        uses: hyoaru/actions/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          title: "Itala API Release - ${{ github.event.release.tag_name }}"
          description: |
            Environment: `${{ needs.setup.outputs.environment }}`
            Setup: `${{ needs.setup.result }}`
            Build: `${{ needs.build.result }}`
            Deploy: `${{ needs.deploy.result }}`
