info:
  name: Create Transaction
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/transactions"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "amount": "1500.50",
        "type": "EXPENSE",
        "account_id": "{{ACCOUNT_ID}}",
        "category_id": "{{CATEGORY_ID}}",
        "description": "Dinner with friends",
        "occurred_at": "{{$isoTimestamp}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
