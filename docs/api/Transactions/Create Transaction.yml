info:
  name: Create Transaction
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/transactions"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
    - name: Idempotency-Key
      value: "transaction-create-001"
  body:
    type: json
    data: |-
      {
        "amount": "1000",
        "account_id": "{{ACCOUNT_ID}}",
        "counterparty_account_id": "{{COUNTERPARTY_ACCOUNT_ID}}",
        "description": "Side hustle",
        "occurred_at": "{{$isoTimestamp}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        if (status >= 200 && status < 300) {
          const body = res.getBody();
          bru.setVar("TRANSACTION_ID", body["id"]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Transaction

  Posts one double-entry transaction. No Category entity exists.

  ## Request

  - `amount` — positive decimal string.
  - `account_id` — balance account UUID.
  - `counterparty_account_id` — category account UUID with type `income` or `expense`.
  - `description` — display text.
  - `occurred_at` — ISO timestamp; stored as `YYYY-MM-DD`.
  - `Idempotency-Key` — required header. Replay with the same key and payload returns the original transaction ID; a different payload returns 409.

  Direction comes from the counterparty account type. `expense` debits the balance account; `income` credits it.

  ## Responses

  - `201` — `{ "id": "<uuid>" }`
  - `400` — invalid request or unbalanced postings.
  - `404` — account not found.
  - `409` — idempotency payload mismatch.
