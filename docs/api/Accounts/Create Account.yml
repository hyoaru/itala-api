info:
  name: Create Account
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/accounts"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: '{"name": "BPI 32234"}'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        if (status >= 200 && status < 300) {
          const body = res.getBody();
          bru.setEnvVar("ACCOUNT_ID", body["id"]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
