info:
  name: Restore Account
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/accounts/:id/restore"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{ACCOUNT_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
