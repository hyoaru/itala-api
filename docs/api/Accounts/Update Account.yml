info:
  name: Update Account
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BASE_URL}}/accounts/:id"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{ACCOUNT_ID}}"
      type: path
  body:
    type: json
    data: '{"name": "BPI Emergency", "status": "ACTIVE"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
