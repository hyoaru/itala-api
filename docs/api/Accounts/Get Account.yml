info:
  name: Get Account
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/accounts/:id"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{ACCOUNT_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get Account

  Reads account metadata by identifier.

  ## Response

  - `id` — UUID.
  - `name` — display name.
  - `type` — `asset`, `liability`, `income`, or `expense`.
  - `created_at`, `updated_at` — ISO timestamps.

  Balance is not part of this response. Read it from the dashboard projection.

  ## Errors

  - `404` — account not found or deleted.
