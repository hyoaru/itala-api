info:
  name: Update Category
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BASE_URL}}/categories/:id"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{CATEGORY_ID}}"
      type: path
  body:
    type: json
    data: '{"name": "Side Hustle", "status": "ARCHIVED"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
