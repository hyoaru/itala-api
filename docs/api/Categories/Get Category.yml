info:
  name: Get Category
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/categories/:id"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{CATEGORY_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
