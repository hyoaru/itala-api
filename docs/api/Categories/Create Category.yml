info:
  name: Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/categories"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "name": "Salary",
        "type": "INCOME"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
