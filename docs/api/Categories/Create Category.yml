info:
  name: Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/categories"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "name": "Salary",
        "transaction_type": "INCOME"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();

        if (status >= 200 && status < 300) {
          const body = res.getBody();
          bru.setVar("CATEGORY_ID", body["id"]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
