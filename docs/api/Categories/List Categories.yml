info:
  name: List Categories
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/categories"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: status
      value: ARCHIVED
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
