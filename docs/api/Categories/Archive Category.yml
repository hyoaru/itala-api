info:
  name: Archive Category
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/categories/:id/archive"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  params:
    - name: id
      value: "{{CATEGORY_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
